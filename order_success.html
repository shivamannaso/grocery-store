<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .success-card {
            max-width: 520px;
            margin: 80px auto;
            background: #ffffff;
            border-radius: 14px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .success-icon {
            width: 90px;
            height: 90px;
            background: #e6f7ec;
            color: #28a745;
            font-size: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            margin-bottom: 20px;
        }

        .success-title {
            font-size: 26px;
            font-weight: 700;
            color: #222;
        }

        .success-text {
            color: #666;
            margin-top: 10px;
            font-size: 15px;
        }

        .order-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px;
            font-size: 14px;
            color: #444;
        }

        .order-info span {
            font-weight: 600;
        }

        .btn-main {
            background: #28a745;
            color: #fff;
            border-radius: 30px;
            padding: 10px 25px;
            font-size: 15px;
        }

        .btn-main:hover {
            background: #218838;
            color: #fff;
        }

        .btn-outline {
            border-radius: 30px;
            padding: 10px 25px;
            font-size: 15px;
        }

        .trust-text {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="success-card">

    <div class="success-icon">
        ✔
    </div>

    <div class="success-title">
        Order Placed Successfully!
    </div>

    <div class="success-text">
        Thank you for shopping with us.<br>
        Your order has been confirmed and is being prepared.
    </div>

    <div class="order-info">
        📦 <span>Fast Delivery</span> • 🛡️ <span>Secure Order</span> • 🔔 <span>Live Updates</span>
    </div>

    <div class="d-grid gap-2 mt-4">
        <a href="/customer/home" class="btn btn-main">
            Continue Shopping
        </a>

        <a href="/orders" class="btn btn-outline-secondary">
            View My Orders
        </a>
    </div>

    <div class="trust-text">
        Need help? Contact our support anytime.<br>
        We appreciate your trust ❤️
    </div>

</div>

</body>
</html>
