<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Grocery Store</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg, #2e4b35, #20c997);
            min-height: 100vh;
        }

        .login-card {
            border-radius: 15px;
            overflow: hidden;
        }

        .left-panel {
            background: linear-gradient(160deg, #1e7e34, #1fd245);
            color: white;
            padding: 40px;
        }

        .left-panel h2 {
            font-weight: 700;
        }

        .form-control, .form-select {
            border-radius: 10px;
        }

        .btn-success {
            border-radius: 10px;
            font-weight: 600;
        }

        .register-link {
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card login-card shadow-lg w-100" style="max-width:900px;">
        <div class="row g-0">

            <!-- LEFT BRAND PANEL -->
            <div class="col-md-5 d-none d-md-block left-panel">
                <h2>🛒 Grocery Store</h2>
                <p class="mt-3">
                    Fresh groceries delivered to your doorstep.
                </p>

                <ul class="mt-4">
                    <li>✔ Grocery</li>
                    <li>✔ food</li>
                    <li>✔ Household</li>
                </ul>

                <p class="mt-5 small">
                    © 2026 Grocery Store Inc.
                </p>
            </div>

            <!-- RIGHT LOGIN FORM -->
            <div class="col-md-7 bg-white p-4 p-md-5">
                <h4 class="mb-4 fw-bold">Login to your account</h4>

                <form method="POST">

    <div class="mb-3">
        <label class="form-label">Email / Username</label>
        <input type="text" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
    </div>

    <button class="btn btn-success w-100 py-2">
        Login
    </button>

    {% if error %}
        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>
    {% endif %}

    <div class="text-center mt-3">
        <span class="text-muted">New customer?</span>
        <a href="/customer/register" class="text-success fw-bold">
            Create account
        </a>
    </div>

</form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
