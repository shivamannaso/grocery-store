<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">🛒 Grocery Store</span>
    <a href="/customer/home" class="btn btn-outline-success btn-sm">Continue Shopping</a>
</nav>

<div class="container mt-4">
    <h4 class="mb-3">🛍️ Your Cart</h4>

    {% if cart_items %}
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for item in cart_items %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>₹{{ item.price }}</td>
                    <td>{{ item.quantity }}</td>
                    <td>
                        <a href="/remove_from_cart/{{ item.id }}"
                           class="btn btn-danger btn-sm">
                            ❌ Remove
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <h5 class="text-end mt-3">
            <strong>Grand Total: ₹ {{ grand_total }}</strong>
        </h5>

        <div class="text-end mt-3">
            <a href="/checkout" class="btn btn-success">
                Proceed to Checkout
            </a>
        </div>

    {% else %}
        <div class="alert alert-info">
            Your cart is empty.
        </div>
    {% endif %}
</div>

</body>
</html>
